name: Build APK di prova

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installa le dipendenze
        run: npm install

      - name: Prepara la parte web
        run: npm run build

      - name: Crea il progetto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Blocca lo schermo in verticale
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q screenOrientation "$M" || sed -i 's/<activity/<activity android:screenOrientation="portrait"/' "$M"

      - name: Compila l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Conserva l'APK
        uses: actions/upload-artifact@v4
        with:
          name: sabetta-prova-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
